[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"  # no Deploy button or developer menu for analysts

# Dusk palette: runway lights against a violet evening sky. Fuchsia and amber are accents only.
[theme]
base = "light"
primaryColor = "#7C3AED"
backgroundColor = "#FAF8FF"
secondaryBackgroundColor = "#F1ECFD"
textColor = "#1F1535"
borderColor = "#E0D6F8"
linkColor = "#6D28D9"
baseRadius = "large"
chartCategoricalColors = ["#7C3AED", "#DB2777", "#F59E0B", "#0EA5E9", "#10B981", "#A78BFA"]
headingFont = "Sora:https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap"

[theme.sidebar]
backgroundColor = "#F1ECFD"
