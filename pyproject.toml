[project]
name = "airport-investment-agent"
version = "0.1.0"
description = "AI agent that ranks and explains US airport renovation opportunities"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain-core>=1.7",
    "langchain-openai>=1.7",
    "langchain-anthropic>=1.7",
    "langchain-google-genai>=4.4",
    "openai>=3.40",
    "streamlit>=1.66",
    "altair>=5.5",
    "duckdb>=2.0",
    "pandas>=3.1",
    "pyarrow>=26",
    "httpx>=0.28",
    "pydantic>=2.14",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airport_agent", "app"]  # app too, so `streamlit run app/streamlit_app.py` can import it

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import `tests.fixtures` and `evals.run_evals`

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
